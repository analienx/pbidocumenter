name: Apply TMDL parser fix

on:
  push:
    branches:
      - agent/fix-tmdl-table-name-parser

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tmdl-table-name-parser
      - name: Apply exact parser edit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('copiloter.py')
          text = path.read_text(encoding='utf-8')
          old = '        m = re.match(r"^table\\s+'
          new = '        m = re.search(r"^table\\s+'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one parser match site, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit parser edit only
        run: |
          git diff --check -- copiloter.py
          git diff -- copiloter.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- copiloter.py
          git commit -m 'Fix TMDL table-name parsing after comments'
          git push origin HEAD:agent/fix-tmdl-table-name-parser
