name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[all]"
      - run: python -m pytest pbip_documenter/tests
      - run: ruff check .
      - run: mypy pbip_documenter

  cli-installed-wheel:
    name: CLI wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: Install built wheel and verify CLI JSON and native DOCX
        run: python scripts/ci_cli_v1_smoke.py --install-wheel

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python scripts/ci_readme_showcase.py
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: pbip-documenter --version
      - run: python scripts/ci_docx_generation_smoke.py --output-dir generated-documents
      - uses: actions/upload-artifact@v4
        with:
          name: contoso-generated-word-specifications
          path: generated-documents/*.docx
          if-no-files-found: error
          retention-days: 7

  docx-render-acceptance:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install headless Word renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation2
      - run: python -m pip install . "pymupdf>=1.24,<2"
      - uses: actions/download-artifact@v4
        with:
          name: contoso-generated-word-specifications
          path: generated-documents
      - name: Verify PBIP fidelity and inspect PDF pagination geometry
        run: |
          python scripts/ci_docx_render_acceptance.py --docx-dir generated-documents --render-dir generated-render-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contoso-rendered-word-review-evidence
          path: generated-render-evidence
          if-no-files-found: warn
          retention-days: 7
